services:
  db:
    image: postgres:18-alpine
    container_name: studyenglish-db
    environment:
      POSTGRES_DB: studyenglish
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - studyenglish-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studyenglish"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  
volumes:
  studyenglish-db-data: